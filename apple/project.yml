name: App
options:
  bundleIdPrefix: no.huginn
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  AppCore:
    path: AppCore

settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    # Keychain krever en signatur med application-identifier også i simulatoren (usignert gir -34018).
    # Ad hoc ("-") holder der; device-modus overstyrer på kommandolinja, og macOS er urørt (SDK-betinget).
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  App:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: ["**/*.md"]
    dependencies:
      - package: AppCore
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Retning: iPhone låses til portrett. iPad må støtte alle fire for å slippe «All interface orientations must be
        # supported unless the app requires full screen» (multitasking/Split View). UIRequiresFullScreen ville tatt bort
        # Split View og Slide Over, og Apple avvikler det; alle fire er det riktige svaret. (_iPad må settes eksplisitt:
        # generert standard utelater opp-ned-portrett, og det er det som utløser advarselen.)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Navnet på hjemskjermen er «Basic» (repo og produkt heter huginn; design-arbeidsflate §9). Bundle-ID og
        # PRODUCT_NAME er uendret, så provisjonering og eksisterende bygg ikke påvirkes.
        INFOPLIST_KEY_CFBundleDisplayName: "Basic"
        # Godkjenn spør etter Face ID (LocalAuthentication); uten teksten feiler biometri på enhet.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Huginn bekrefter med Face ID at det er deg som godkjenner."

  App-macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        excludes: ["**/*.md"]
    dependencies:
      - package: AppCore

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: App
      - package: AppCore

schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets: [AppTests]

  App-macOS:
    build:
      targets:
        App-macOS: all
