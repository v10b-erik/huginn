<h1>Huginn — fire retninger for «Nå»-skjermen</h1>
<p class="ingress">Samme skjerm og samme innhold i alle fire, bare tradisjonen er byttet. Regelen fra plattformen gjelder overalt: <b>farge betyr avvik eller «krever deg»</b>, resten er dempet. Trykk på et bilde for å åpne den levende HTML-en.</p>
<div class="rutenett">
<figure><a href="proeve-a.html"><img src="skjermbilder/proeve-a.png" alt="Prøve A"></a><figcaption>
<h2>A — Sveitsisk typografi</h2>
<p><b>Typografi:</b> Archivo alene. <b>Farge:</b> hvitt og sort, ett signalrødt.</p>
<p><b>Signatur:</b> tallet er statusen. «1» i 128 px; en rolig dag er et grått «0».</p></figcaption></figure>
<figure><a href="proeve-b.html"><img src="skjermbilder/proeve-b.png" alt="Prøve B"></a><figcaption>
<h2>B — Instrumentpanel</h2>
<p><b>Typografi:</b> Martian Mono + Barlow Condensed. <b>Farge:</b> blåsvart; ravgult = krever deg, cyan = pågår.</p>
<p><b>Signatur:</b> annunciator-stripa øverst lyser bare når noe har en grunn. Køens fire steg er fire segmenter.</p></figcaption></figure>
<figure><a href="proeve-c.html"><img src="skjermbilder/proeve-c.png" alt="Prøve C"></a><figcaption>
<h2>C — Redaksjonell</h2>
<p><b>Typografi:</b> Newsreader + IBM Plex Sans Condensed. <b>Farge:</b> hvitt og sort, uthevingstusj-gult for «krever deg».</p>
<p><b>Signatur:</b> «Nå» som en kort briefing: køen og dagen er setninger, akkurat det en talsperson kan lese opp.</p></figcaption></figure>
<figure><a href="proeve-d.html"><img src="skjermbilder/proeve-d.png" alt="Prøve D"></a><figcaption>
<h2>D — Industridesign</h2>
<p><b>Typografi:</b> Familjen Grotesk + DM Mono + punktmatrise. <b>Farge:</b> kjølig grått, oransje = krever deg.</p>
<p><b>Signatur:</b> LCD-avlesning øverst, moduler under, knapper med kant under som ser ut til å kunne trykkes inn.</p></figcaption></figure>
